<iframe id="f" src="http://127.0.0.1:8813/app/lessons/lesson14.html?preview=1" width="1500" height="1000"></iframe>
<pre id="out"></pre>
<script>
const SRC = "\nJOBS_SYNC = true;\nfunction typedRows(ch, K, rng, want) {\n  const pick = [], seen = new Set();\n  while (pick.length < Math.min(want, K)) { const k = (rng() * K) | 0; if (!seen.has(k)) { seen.add(k); pick.push(k); } }\n  const rows = pick.map(k => { const bits = new Uint8Array(B_M); for (let m = 0; m < B_M; m++) bits[m] = B_bit(ch, k, m); return bits; });\n  return rows;\n}\nconst nPop = (pops, typed, ai, v, stop, rng) => {\n  const n = B_nAt(v), adv = B_ADV[ai];\n  const qs = [];\n  for (let j = 0; j < pops; j++) {\n    const run = B_run(B_found(n, rng), adv, stop, rng, 0);\n    const rows = typedRows(run.ch, 2 * run.n, rng, typed);\n    qs.push(B_profile(rows).counts);\n  }\n  return B_LOCI.map((_, c) => qs.reduce((s, q) => s + q[c], 0) / qs.length);\n};\nconst derive = (pops, typed, ai, v, stop, seedBase, reps) => {\n  const profiles = [];\n  for (let q = 0; q < reps; q++) profiles.push(nPop(pops, typed, ai, v, stop, mulberry32(seedBase + q * 7919)));\n  const meanLoc = B_LOCI.map((_, c) => profiles.reduce((a, p) => a + p[c], 0) / profiles.length);\n  const dists = profiles.map(p => B_profDist(p, meanLoc)).sort((a, b) => a - b);\n  const bar90 = dists[Math.min(dists.length - 1, Math.floor(0.90 * dists.length))];\n  const bar95 = dists[Math.min(dists.length - 1, Math.floor(0.95 * dists.length))];\n  const vprofiles = []; for (let q = 0; q < 40; q++) vprofiles.push(nPop(pops, typed, ai, v, stop, mulberry32(seedBase + 500000 + q * 7919)));\n  const vdists = vprofiles.map(p => B_profDist(p, meanLoc));\n  const hit90 = vdists.filter(d => d <= bar90).length / vdists.length;\n  const hit95 = vdists.filter(d => d <= bar95).length / vdists.length;\n  return { meanLoc, bar90, bar95, hit90, hit95 };\n};\nconst gridTest = (pops, typed, ROUNDS, barKey, repsPerCell) => {\n  let most = 0; const multi = [];\n  const stops = [...new Set(ROUNDS.map(r => r.stop))];\n  for (let ai = 0; ai < B_ADV.length; ai++) for (let v = 0; v <= 100; v += 20) {\n    const by = {};\n    for (const stop of stops) { by[stop] = []; for (let q = 0; q < repsPerCell; q++) by[stop].push(nPop(pops, typed, ai, v, stop, mulberry32(333 + q * 104729))); }\n    const rates = ROUNDS.map(r => by[r.stop].filter(loc => B_profDist(loc, r.meanLoc) <= r[barKey]).length / repsPerCell);\n    const c = rates.filter(x => x >= 0.5).length;\n    most = Math.max(most, c);\n    if (c >= 2) multi.push(B_ADV[ai] + \",\" + B_nAt(v) + \": \" + ROUNDS.map((r,i)=>r.key+\"=\"+rates[i].toFixed(2)).join(\" \"));\n  }\n  return { most, multi };\n};\n\nconst SETTINGS = [\n  { key: \"fast\", ai: 9, v: 19, stop: 0.95 },\n  { key: \"slow\", ai: 3, v: 6, stop: 0.95 },\n  { key: \"mid\", ai: 6, v: 38, stop: 0.95 },\n  { key: \"small\", ai: 4, v: 80, stop: 0.95 },\n  { key: \"partial\", ai: 6, v: 27, stop: 0.5 }\n];\n\nconst COMBOS = [\n  { pops: 6, typed: 150, reps: 50, cellReps: 5 }\n];\n\nconst out = {};\nfor (const combo of COMBOS) {\n  const ROUNDS = SETTINGS.map((s, i) => Object.assign({ key: s.key, ai: s.ai, v: s.v, stop: s.stop },\n    derive(combo.pops, combo.typed, s.ai, s.v, s.stop, 8000 + i * 10000, combo.reps)));\n  const g95 = gridTest(combo.pops, combo.typed, ROUNDS, \"bar95\", combo.cellReps);\n  const openRate = r => { let k = 0; for (let q = 0; q < 15; q++) if (B_profDist(nPop(combo.pops, combo.typed, 4, 45, r.stop, mulberry32(4444 + q * 7919)), r.meanLoc) <= r.bar95) k++; return k / 15; };\n  const opens = ROUNDS.map(r => [r.key, openRate(r)]);\n  const crossRate = (giver, getter) => { let k = 0; for (let q = 0; q < 15; q++) if (B_profDist(nPop(combo.pops, combo.typed, giver.ai, giver.v, getter.stop, mulberry32(5555 + q * 7919)), getter.meanLoc) <= getter.bar95) k++; return k / 15; };\n  const cross = [];\n  for (const a of ROUNDS) for (const b of ROUNDS) if (a !== b) cross.push([a.key + \"->\" + b.key, crossRate(a, b)]);\n  out[\"pops\" + combo.pops + \"_typed\" + combo.typed] = {\n    bars: ROUNDS.map(r => ({ key: r.key, ai: r.ai, v: r.v, n: B_nAt(r.v), adv: B_ADV[r.ai], meanLoc: r.meanLoc, bar90: r.bar90, bar95: r.bar95, hit90: r.hit90, hit95: r.hit95 })),\n    g95, opens, cross: cross.filter(x => x[1] >= 0.3)\n  };\n}\nJSON.stringify(out);\n";
document.getElementById("f").addEventListener("load", () => setTimeout(() => {
  const w = document.getElementById("f").contentWindow;
  let res;
  try { res = String(w.eval(SRC)); }
  catch (e) { res = JSON.stringify({ ERROR: e.message, stack: (e.stack||"").split("\n").slice(0,3) }); }
  document.getElementById("out").textContent = res;
  document.title = "done";
}, 3000));
</script>
