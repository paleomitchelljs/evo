<!doctype html><meta charset="utf-8"><title>pending</title>
<iframe id="f" src="http://127.0.0.1:8812/app/lessons/lesson14.html?preview=1" width="1500" height="1000"></iframe>
<pre id="out"></pre>
<script>
const SRC = "\nJOBS_SYNC = true;\nfunction typedRows(ch, K, rng, want) {\n  const pick = [], seen = new Set();\n  while (pick.length < Math.min(want, K)) { const k = (rng() * K) | 0; if (!seen.has(k)) { seen.add(k); pick.push(k); } }\n  return pick.map(k => { const bits = new Uint8Array(B_M); for (let m = 0; m < B_M; m++) bits[m] = B_bit(ch, k, m); return bits; });\n}\nconst POPS = 6, TYPED = 150;\nconst nPop = (ai, v, stop, rng) => {\n  const n = B_nAt(v), adv = B_ADV[ai];\n  const qs = [];\n  for (let j = 0; j < POPS; j++) {\n    const run = B_run(B_found(n, rng), adv, stop, rng, 0);\n    qs.push(B_profile(typedRows(run.ch, 2 * run.n, rng, TYPED)).counts);\n  }\n  return B_LOCI.map((_, c) => qs.reduce((s, q) => s + q[c], 0) / qs.length);\n};\nconst derive = (ai, v, stop, seedBase, reps) => {\n  const profiles = [];\n  for (let q = 0; q < reps; q++) profiles.push(nPop(ai, v, stop, mulberry32(seedBase + q * 7919)));\n  const meanLoc = B_LOCI.map((_, c) => profiles.reduce((a, p) => a + p[c], 0) / profiles.length);\n  const dists = profiles.map(p => B_profDist(p, meanLoc)).sort((a, b) => a - b);\n  const bar95 = dists[Math.min(dists.length - 1, Math.floor(0.95 * dists.length))];\n  return { meanLoc, bar95, n: B_nAt(v), adv: B_ADV[ai] };\n};\nconst rateOf = (giverAi, giverV, getter, reps, seed) => { let k = 0;\n  for (let q = 0; q < reps; q++) if (B_profDist(nPop(giverAi, giverV, getter.stop, mulberry32(seed + q * 7919)), getter.meanLoc) <= getter.bar95) k++;\n  return k / reps; };\n\nconst fast = Object.assign({ stop: 0.95 }, derive(9, 19, 0.95, 8000, 60));\nconst slow = Object.assign({ stop: 0.95 }, derive(3, 6, 0.95, 8100, 60));\nconst mid = Object.assign({ stop: 0.95 }, derive(6, 38, 0.95, 8200, 60));\nconst small = Object.assign({ stop: 0.95 }, derive(4, 80, 0.95, 8300, 60));\n\nconst CANDIDATES = [45, 35, 27, 14, 2];\nconst out = { fast, slow, mid, small, candidates: {} };\nfor (const v of CANDIDATES) {\n  const partial = Object.assign({ stop: 0.5 }, derive(6, v, 0.5, 9000 + v * 97, 60));\n  const selfHit = (() => { let k = 0; const reps = 30;\n    for (let q = 0; q < reps; q++) if (B_profDist(nPop(6, v, 0.5, mulberry32(9500000 + v * 97 + q * 7919)), partial.meanLoc) <= partial.bar95) k++;\n    return k / reps; })();\n  out.candidates[v] = {\n    n: partial.n, bar95: partial.bar95, selfHit,\n    fastToPartial: rateOf(9, 19, partial, 20, 5555),\n    slowToPartial: rateOf(3, 6, partial, 20, 5556),\n    midToPartial: rateOf(6, 38, partial, 20, 5557),\n    smallToPartial: rateOf(4, 80, partial, 20, 5558),\n    partialToFast: rateOf(6, v, fast, 20, 5559),\n    partialToSlow: rateOf(6, v, slow, 20, 5560),\n    partialToMid: rateOf(6, v, mid, 20, 5561),\n    partialToSmall: rateOf(6, v, small, 20, 5562)\n  };\n}\nJSON.stringify(out);\n";
document.getElementById("f").addEventListener("load", () => setTimeout(() => {
  const w = document.getElementById("f").contentWindow;
  let res;
  try { res = String(w.eval(SRC)); }
  catch (e) { res = JSON.stringify({ ERROR: e.message, stack: (e.stack||"").split("\n").slice(0,3) }); }
  document.getElementById("out").textContent = res;
  document.title = "done";
}, 3000));
</script>
